<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OSL Privacy — End-to-end encryption for Discord</title>
  <meta name="description" content="OSL adds end-to-end encryption to Discord. Your messages stay private from Discord, your network, and anyone else watching. Built on post-quantum cryptography.">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="index, follow">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <main>
    <section class="hero">
      <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" aria-hidden="true" focusable="false">
        <rect x="20" y="36" width="40" height="32" rx="3" fill="none" stroke="currentColor" stroke-width="3"/>
        <path d="M 28 36 V 26 a 12 12 0 0 1 24 0 V 36" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        <circle cx="40" cy="50" r="3" fill="currentColor"/>
        <line x1="40" y1="53" x2="40" y2="60" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      </svg>

      <h1>OSL Privacy</h1>
      <p class="subhead">End-to-end encryption for Discord. Coming 2026.</p>

      <p class="description">
        OSL adds end-to-end encryption to Discord. Your messages stay private from Discord, your network, and anyone else watching. Built on post-quantum cryptography.
      </p>

      <form class="notify-form" id="notify-form" action="#" novalidate>
        <label for="email" class="visually-hidden">Email address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
        <button type="submit">Notify me</button>
      </form>
      <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
    </section>

  <script src="/assets/js/main.js" defer></script>
